<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>칠원 구성지구 마을투어</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#F7F6F3;--bg2:#EFEDE9;--bg3:#E8E5E0;--border:#D9D5CE;--border2:#C8C3BA;--text:#1A1916;--text2:#6B6760;--text3:#9A9690;--green:#1D9E75;--green-light:#E1F5EE;--green-dark:#0F6E56;--red:#A32D2D;--red-light:#FCEBEB;--amber:#854F0B;--amber-light:#FAEEDA;--blue:#185FA5;--blue-light:#E6F1FB;--radius:6px;--radius-lg:10px;}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;}
#app{display:flex;height:100vh;}
#sidebar{width:268px;min-width:268px;background:white;border-right:1px solid var(--border);display:flex;flex-direction:column;box-shadow:2px 0 8px rgba(0,0,0,.04);}
#sh{padding:14px 16px;border-bottom:1px solid var(--border);}
#sh h1{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px;display:flex;align-items:center;gap:6px;}
#sh h1 i{color:var(--green);}
#sh p{font-size:11px;color:var(--text2);}
.sync-bar{padding:6px 14px;background:var(--bg2);border-bottom:1px solid var(--border);font-size:10px;color:var(--text2);display:flex;align-items:center;gap:6px;}
.sync-bar.ok{color:var(--green-dark);background:var(--green-light);}
.sync-bar.err{color:var(--red);background:var(--red-light);}
.sync-bar.ing{color:var(--amber);background:var(--amber-light);}
.tab-row{display:flex;border-bottom:1px solid var(--border);}
.tab-btn{flex:1;padding:9px 4px;font-size:11px;font-weight:500;border:none;background:transparent;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;}
.tab-btn.active{color:var(--green);border-bottom-color:var(--green);background:var(--bg);}
#sb{flex:1;overflow-y:auto;}
#sb::-webkit-scrollbar{width:4px;}
#sb::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.course-card{padding:11px 13px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;position:relative;}
.course-card:hover{background:var(--bg);}
.course-card.active{background:var(--green-light);}
.cn{font-size:12px;font-weight:600;color:var(--text);margin-bottom:3px;padding-right:24px;line-height:1.3;}
.cm{font-size:10px;color:var(--text2);}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:99px;font-weight:500;margin-bottom:4px;}
.b-turtle{background:var(--amber-light);color:var(--amber);}
.b-31{background:#FAECE7;color:#993C1D;}
.b-bigak{background:var(--green-light);color:var(--green-dark);}
.b-new31{background:#FAECE7;color:#7F3318;}
.b-hyo{background:var(--blue-light);color:var(--blue);}
.b-custom{background:var(--bg2);color:var(--text2);}
.new-tag{font-size:9px;padding:1px 5px;background:#FAC775;color:#633806;border-radius:3px;margin-left:4px;}
.hub-tag{font-size:9px;padding:1px 5px;background:var(--green-light);color:var(--green-dark);border-radius:3px;margin-left:4px;}
.cdel{position:absolute;top:9px;right:9px;width:18px;height:18px;border-radius:50%;border:1px solid var(--border);background:white;color:var(--text2);font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;}
.course-card:hover .cdel{opacity:1;}
.cdel:hover{background:var(--red-light);color:var(--red);}
.spot-item{display:flex;align-items:center;gap:7px;padding:8px 13px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;position:relative;}
.spot-item:hover{background:var(--bg);}
.spot-item.active{background:var(--green-light);}
.spot-item.is-hub{border-left:3px solid var(--green);}
.snum{width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0;color:white;}
.sinfo{flex:1;min-width:0;}
.sname{font-size:12px;font-weight:500;color:var(--text);line-height:1.3;}
.stype{font-size:10px;color:var(--text2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sord{display:flex;flex-direction:column;gap:1px;flex-shrink:0;}
.sord button{width:16px;height:13px;border:1px solid var(--border);background:white;border-radius:3px;font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);}
.sord button:hover{background:var(--bg2);}
.sdel{width:17px;height:17px;border-radius:50%;border:1px solid var(--border);background:white;color:var(--text2);font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:0;}
.spot-item:hover .sdel{opacity:1;}
.sdel:hover{background:var(--red-light);color:var(--red);}
.add-btn-row{display:flex;gap:6px;padding:9px 13px;border-top:1px solid var(--border);}
.add-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:7px 6px;border:1.5px dashed var(--border);border-radius:var(--radius);background:transparent;font-size:11px;color:var(--text2);cursor:pointer;font-family:inherit;}
.add-btn:hover{background:var(--bg2);color:var(--text);}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
#mh{padding:10px 14px;background:white;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(0,0,0,.04);}
#mh h2{font-size:13px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.abtn{padding:5px 10px;border:1px solid var(--border);border-radius:var(--radius);background:white;font-size:11px;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap;font-family:inherit;}
.abtn:hover{background:var(--bg2);}
.abtn.primary{background:var(--green);color:white;border-color:var(--green);}
.abtn.primary:hover{background:var(--green-dark);}
.abtn.danger{color:var(--red);border-color:#F09595;}
.abtn.danger:hover{background:var(--red-light);}
.abtn.cloud{background:#6366F1;color:white;border-color:#6366F1;}
.abtn.cloud:hover{background:#4F46E5;}
#ca{flex:1;display:flex;overflow:hidden;}
#map-panel{flex:1;background:var(--bg2);position:relative;overflow:hidden;min-width:0;}
#map-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--text2);font-size:12px;line-height:2;pointer-events:none;z-index:1;}
#map-ph i{font-size:38px;margin-bottom:6px;color:var(--border2);}
#map-container{width:100%;height:100%;}
#api-ok{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:white;border:1px solid var(--border);border-radius:var(--radius);padding:6px 12px;font-size:11px;color:var(--green);display:none;align-items:center;gap:5px;white-space:nowrap;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.08);}
#dp{width:314px;min-width:314px;background:white;border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;box-shadow:-2px 0 8px rgba(0,0,0,.04);}
#dh{padding:10px 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px;}
#dh h3{font-size:13px;font-weight:600;flex:1;}
#db{flex:1;overflow-y:auto;padding:13px;}
#db::-webkit-scrollbar{width:4px;}
#db::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.fl{font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;}
.fv{font-size:12px;color:var(--text);line-height:1.65;}
.fg{margin-bottom:13px;}
.fi{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius);font-size:12px;color:var(--text);background:var(--bg);font-family:inherit;}
.fi:focus{outline:none;border-color:var(--green);}
.fta{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius);font-size:12px;color:var(--text);background:var(--bg);font-family:inherit;resize:vertical;min-height:80px;line-height:1.65;}
.fta:focus{outline:none;border-color:var(--green);}
.addr-row{display:flex;gap:5px;}
.addr-row .fi{flex:1;}
.addr-btn{padding:6px 9px;border:1px solid var(--green);border-radius:var(--radius);background:var(--green);color:white;font-size:11px;cursor:pointer;white-space:nowrap;font-family:inherit;flex-shrink:0;}
.addr-btn:hover{background:var(--green-dark);}
.addr-result{margin-top:5px;padding:6px 8px;border-radius:var(--radius);font-size:11px;display:none;}
.addr-result.show{display:block;}
.addr-result.ok{color:var(--green-dark);background:var(--green-light);}
.addr-result.err{color:var(--red);background:var(--red-light);}
.addr-result.ing{color:var(--text2);background:var(--bg2);}
.coord-note{font-size:10px;color:var(--text3);margin-top:3px;}
.coord-note.warn{color:#E08000;}
.tag-row{display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
.tag{font-size:10px;padding:2px 8px;border-radius:99px;background:var(--bg2);color:var(--text2);display:flex;align-items:center;gap:3px;}
.tag-del{cursor:pointer;color:var(--text3);font-size:10px;border:none;background:none;padding:0;}
.tag-del:hover{color:var(--red);}
.tag-add-row{display:flex;gap:5px;margin-top:6px;}
.tag-add-row input{flex:1;padding:4px 7px;border:1px solid var(--border);border-radius:var(--radius);font-size:11px;background:var(--bg);color:var(--text);font-family:inherit;}
.tag-add-row button{padding:4px 9px;border:1px solid var(--border);border-radius:var(--radius);font-size:11px;background:white;cursor:pointer;font-family:inherit;}
.tag-add-row button:hover{background:var(--bg2);}
.mission-box{background:var(--amber-light);border-radius:var(--radius);padding:8px 10px;font-size:11px;color:#633806;margin-bottom:8px;line-height:1.6;display:flex;gap:6px;align-items:flex-start;}
.hub-box{background:var(--green-light);border-radius:var(--radius);padding:7px 10px;font-size:11px;color:var(--green-dark);margin-bottom:11px;display:flex;align-items:center;gap:6px;font-weight:500;}
.empty-s{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text3);font-size:12px;gap:9px;}
.empty-s i{font-size:28px;}
.kr{display:flex;gap:6px;padding:9px 13px;border-top:1px solid var(--border);align-items:center;background:var(--bg);}
.kr input{flex:1;font-size:11px;padding:5px 8px;border:1px solid var(--border);border-radius:var(--radius);background:white;color:var(--text);font-family:inherit;}
.color-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.color-chip{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;}
.color-chip.selected{border-color:var(--text);}
.flow-wrap{display:flex;flex-direction:column;}
.flow-item{display:flex;align-items:flex-start;gap:8px;padding:3px 0;}
.flow-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.flow-line{width:1px;height:9px;background:var(--border);margin-left:3px;}
.flow-name{font-size:11px;color:var(--text);line-height:1.4;}
.flow-sub{font-size:10px;color:var(--text2);}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:1000;}
.ob{background:white;border-radius:var(--radius-lg);padding:20px 22px;max-width:300px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.15);}
.ob h4{font-size:13px;font-weight:600;margin-bottom:7px;}
.ob p{font-size:11px;color:var(--text2);margin-bottom:14px;line-height:1.5;}
.ob-btns{display:flex;gap:7px;justify-content:flex-end;}
.spot-picker{background:white;border-radius:var(--radius-lg);padding:0;width:360px;max-width:95vw;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.15);}
.sp-head{padding:13px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.sp-head h4{font-size:13px;font-weight:600;flex:1;}
.sp-search{padding:9px 13px;border-bottom:1px solid var(--border);}
.sp-search input{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius);font-size:12px;font-family:inherit;background:var(--bg);}
.sp-search input:focus{outline:none;border-color:var(--green);}
.sp-list{flex:1;overflow-y:auto;padding:5px 0;}
.sp-item{padding:8px 13px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s;}
.sp-item:hover{background:var(--green-light);}
.sp-item-name{font-size:12px;font-weight:500;color:var(--text);}
.sp-item-sub{font-size:10px;color:var(--text2);margin-top:2px;}
.sp-empty{padding:20px;text-align:center;font-size:12px;color:var(--text3);}
.sp-foot{padding:9px 13px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sh">
      <h1><i class="ti ti-map-pin"></i> 칠원 구성지구 마을투어</h1>
      <p>도시재생 마을해설사 코스 관리 시스템</p>
    </div>
    <div class="sync-bar" id="sync-bar"><i class="ti ti-cloud-off"></i> 클라우드 연결 안됨</div>
    <div class="tab-row">
      <button class="tab-btn active" onclick="switchTab('courses')" id="tc">코스</button>
      <button class="tab-btn" onclick="switchTab('spots')" id="ts">지점</button>
    </div>
    <div id="sb">
      <div id="course-list"></div>
      <div id="spot-list" style="display:none;"></div>
    </div>
    <div class="add-btn-row">
      <button class="add-btn" onclick="handleAdd()"><i class="ti ti-plus"></i><span id="al">코스 추가</span></button>
      <button class="add-btn" id="add-from-lib" onclick="openSpotPicker()" style="display:none;" title="등록된 지점에서 추가"><i class="ti ti-books"></i> 목록에서</button>
    </div>
  </div>

  <div id="main">
    <div id="mh">
      <h2 id="mt">코스를 선택하세요</h2>
      <button class="abtn cloud" onclick="syncToCloud()" id="sync-btn"><i class="ti ti-cloud-upload"></i> 저장</button>
      <button class="abtn" onclick="toggleEdit()" id="eb" style="display:none;"><i class="ti ti-edit"></i> 편집</button>
      <button class="abtn primary" onclick="saveEdit()" id="sb2" style="display:none;"><i class="ti ti-check"></i> 저장</button>
      <button class="abtn danger" onclick="confDelC2()" id="db2" style="display:none;"><i class="ti ti-trash"></i> 삭제</button>
    </div>
    <div id="ca">
      <div id="map-panel">
        <div id="map-ph"><i class="ti ti-map"></i>칠원 구성지구<br>하단에 카카오맵 앱 키 입력 후<br>적용 버튼을 눌러주세요</div>
        <div id="map-container"></div>
        <div id="api-ok"><i class="ti ti-check"></i> 카카오맵 연결됨</div>
      </div>
      <div id="dp">
        <div id="dh"><h3 id="dtitle">상세 정보</h3><button class="abtn" onclick="closeDetail()" id="closeb" style="display:none;"><i class="ti ti-x"></i></button></div>
        <div id="db">
          <div class="empty-s" id="es"><i class="ti ti-hand-click"></i><span>코스 또는 지점을 선택하세요</span></div>
          <div id="dc" style="display:none;"></div>
        </div>
        <div class="kr">
          <input type="text" id="kk" placeholder="카카오맵 JavaScript 앱 키 입력"/>
          <button class="abtn" onclick="applyKey()">적용</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ── Supabase 설정 ──
const SB_URL='https://calahckwfhogabduqgpd.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhbGFoY2t3ZmhvZ2FiZHVxZ3BkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MjU5MzIsImV4cCI6MjA5NTAwMTkzMn0.wu40p-6kk8k3OW8pAhGubmmMs4ONTj1LhmaAptZtRhw';
const SB_HEADERS={'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY};

let DATA={courses:[]};
let cc=null,cs=null,tab='courses',em=false,kl=false,km=null,mkrs=[],geocoder=null;

// ── Supabase 연동 ──
function setSyncBar(state,msg){
  const b=document.getElementById('sync-bar');
  b.className='sync-bar '+state;
  b.innerHTML=`<i class="ti ti-${state==='ok'?'cloud-check':state==='err'?'cloud-off':state==='ing'?'loader':'cloud-off'}"></i> ${msg}`;
}

async function loadFromCloud(){
  setSyncBar('ing','클라우드에서 불러오는 중...');
  try{
    const res=await fetch(`${SB_URL}/rest/v1/courses?id=eq.main`,{headers:SB_HEADERS});
    const rows=await res.json();
    if(rows&&rows.length>0&&rows[0].data&&rows[0].data.courses){
      DATA=rows[0].data;
      setSyncBar('ok','클라우드 연결됨 · '+new Date().toLocaleTimeString('ko-KR'));
    } else {
      // 첫 실행 — 기본 데이터로 초기화 후 업로드
      DATA=DEFAULT_DATA;
      await syncToCloud(true);
    }
  }catch(e){
    DATA=DEFAULT_DATA;
    setSyncBar('err','클라우드 연결 실패 · 로컬 데이터 사용 중');
  }
  rl();rsl();if(kl&&km)updateMap();
}

async function syncToCloud(silent=false){
  setSyncBar('ing','저장 중...');
  try{
    const res=await fetch(`${SB_URL}/rest/v1/courses`,{
      method:'POST',
      headers:{...SB_HEADERS,'Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify({id:'main',data:DATA,updated_at:new Date().toISOString()})
    });
    if(res.ok){
      setSyncBar('ok','저장 완료 · '+new Date().toLocaleTimeString('ko-KR'));
      if(!silent) showToast('✓ 클라우드에 저장됐어요!');
    } else {
      throw new Error('저장 실패');
    }
  }catch(e){
    setSyncBar('err','저장 실패 · 다시 시도해주세요');
    if(!silent) alert('저장에 실패했습니다. 네트워크를 확인해주세요.');
  }
}

function showToast(msg){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1A1916;color:white;padding:10px 18px;border-radius:99px;font-size:12px;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.2);';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2500);
}

// ── 전체 지점 목록 ──
function getAllSpots(){
  const seen=new Set();const result=[];
  DATA.courses.forEach(c=>{c.spots.forEach(s=>{
    const key=s.name+'|'+s.addr;
    if(!seen.has(key)&&s.lat&&s.lng){seen.add(key);result.push({...s,_fromCourse:c.name});}
  });});
  return result;
}

function openSpotPicker(){
  if(tab!=='spots'){alert('지점 탭에서 사용해주세요.');return;}
  if(!cc){alert('코스를 먼저 선택하세요.');return;}
  const all=getAllSpots();
  const d=document.createElement('div');d.className='ov';
  d.innerHTML=`<div class="spot-picker"><div class="sp-head"><h4><i class="ti ti-books"></i> 등록된 지점에서 추가</h4><button class="abtn" onclick="this.closest('.ov').remove()"><i class="ti ti-x"></i></button></div><div class="sp-search"><input id="sp-q" placeholder="지점명 또는 주소 검색..." oninput="filterPicker()" autofocus></div><div class="sp-list" id="sp-list">${renderPickerItems(all)}</div><div class="sp-foot"><button class="abtn" onclick="this.closest('.ov').remove()">닫기</button></div></div>`;
  document.body.appendChild(d);
  setTimeout(()=>{const q=document.getElementById('sp-q');if(q)q.focus();},50);
}

function renderPickerItems(spots){
  if(!spots.length)return'<div class="sp-empty">등록된 지점이 없습니다</div>';
  return spots.map(s=>`<div class="sp-item" onclick="addSpotFromPicker('${s.id}')"><div class="sp-item-name">${s.name}</div><div class="sp-item-sub">${s.addr||'주소 없음'} · ${s._fromCourse}</div></div>`).join('');
}

function filterPicker(){
  const q=document.getElementById('sp-q').value.trim().toLowerCase();
  const all=getAllSpots();
  const filtered=q?all.filter(s=>(s.name+s.addr).toLowerCase().includes(q)):all;
  const el=document.getElementById('sp-list');if(el)el.innerHTML=renderPickerItems(filtered);
}

function addSpotFromPicker(sid){
  let orig=null;
  for(const c of DATA.courses){orig=c.spots.find(s=>s.id===sid);if(orig)break;}
  if(!orig)return;
  const newSpot={...JSON.parse(JSON.stringify(orig)),id:'sp'+Date.now(),color:cc.color};
  cc.spots.push(newSpot);rsl();updateMap();
  const ov=document.querySelector('.ov');if(ov)ov.remove();
}

function rl(){
  document.getElementById('course-list').innerHTML=DATA.courses.map(c=>`<div class="course-card ${cc&&cc.id===c.id?'active':''}" onclick="selCourse('${c.id}')"><span class="badge ${c.badge}">${c.badgeText}</span>${c.isNew?'<span class="new-tag">신규</span>':''}<div class="cn">${c.name}</div><div class="cm">${c.spots.length}개 지점 · ${c.duration}</div><button class="cdel" onclick="event.stopPropagation();confDelC('${c.id}')"><i class="ti ti-x"></i></button></div>`).join('');
}

function rsl(){
  const el=document.getElementById('spot-list');
  if(!cc){el.innerHTML='<div style="padding:14px;font-size:12px;color:var(--text2);text-align:center;">코스를 먼저 선택하세요</div>';return;}
  if(!cc.spots.length){el.innerHTML='<div style="padding:14px;font-size:12px;color:var(--text2);text-align:center;">지점을 추가하세요</div>';return;}
  el.innerHTML=cc.spots.map((s,i)=>`<div class="spot-item ${cs&&cs.id===s.id?'active':''} ${s.isHub?'is-hub':''}" onclick="selSpot('${s.id}')"><div class="snum" style="background:${s.isHub?'#1D9E75':s.color}">${i+1}</div><div class="sinfo"><div class="sname">${s.name}${s.isHub?'<span class="hub-tag">거점</span>':''}</div><div class="stype">${s.addr||s.type}</div></div><div class="sord"><button onclick="event.stopPropagation();moveSpot('${s.id}',-1)"><i class="ti ti-chevron-up"></i></button><button onclick="event.stopPropagation();moveSpot('${s.id}',1)"><i class="ti ti-chevron-down"></i></button></div><button class="sdel" onclick="event.stopPropagation();confDelS('${s.id}')"><i class="ti ti-x"></i></button></div>`).join('');
}

function switchTab(t){
  tab=t;
  document.getElementById('course-list').style.display=t==='courses'?'':'none';
  document.getElementById('spot-list').style.display=t==='spots'?'':'none';
  document.getElementById('tc').classList.toggle('active',t==='courses');
  document.getElementById('ts').classList.toggle('active',t==='spots');
  document.getElementById('al').textContent=t==='courses'?'코스 추가':'지점 추가';
  document.getElementById('add-from-lib').style.display=t==='spots'?'':'none';
  if(t==='spots')rsl();
}

function selCourse(id){
  cc=DATA.courses.find(c=>c.id===id);cs=null;em=false;
  rl();rsl();
  document.getElementById('mt').textContent=cc.name;
  document.getElementById('eb').style.display='';
  document.getElementById('sb2').style.display='none';
  document.getElementById('db2').style.display='';
  showCD();updateMap();
}

function selSpot(id){
  cs=cc.spots.find(s=>s.id===id);rsl();showSD();
  if(kl&&km&&cs&&cs.lat&&cs.lng)km.setCenter(new kakao.maps.LatLng(cs.lat,cs.lng));
}

function showCD(){
  const c=cc;show();
  document.getElementById('dtitle').textContent='코스 정보';
  document.getElementById('dc').innerHTML=`
    <div class="fg"><div class="fl">코스명</div>${em?`<input class="fi" id="e-name" value="${esc(c.name)}">`:`<div class="fv" style="font-weight:600;">${c.name}${c.isNew?' <span class="new-tag">신규</span>':''}</div>`}</div>
    <div class="fg"><div class="fl">설명</div>${em?`<textarea class="fta" id="e-desc">${esc(c.desc)}</textarea>`:`<div class="fv">${c.desc||'—'}</div>`}</div>
    <div class="fg"><div class="fl">소요 시간</div>${em?`<input class="fi" id="e-dur" value="${esc(c.duration)}">`:`<div class="fv">${c.duration}</div>`}</div>
    <div class="fg"><div class="fl">거리</div>${em?`<input class="fi" id="e-dist" value="${esc(c.distance)}">`:`<div class="fv">${c.distance}</div>`}</div>
    <div class="fg"><div class="fl">테마</div>${em?`<input class="fi" id="e-theme" value="${esc(c.theme)}">`:`<div class="fv">${c.theme||'—'}</div>`}</div>
    ${em?`<div class="fg"><div class="fl">코스 색상</div><div class="color-row">${COLORS.map(col=>`<div class="color-chip ${c.color===col?'selected':''}" style="background:${col}" onclick="pickColor('${col}')"></div>`).join('')}</div></div>`:''}
    <div class="fg"><div class="fl">코스 흐름</div><div class="flow-wrap">${c.spots.map((s,i)=>`<div class="flow-item"><div style="display:flex;flex-direction:column;align-items:center;"><div class="flow-dot" style="background:${s.isHub?'#1D9E75':s.color}"></div>${i<c.spots.length-1?`<div class="flow-line"></div>`:''}</div><div><div class="flow-name">${i+1}. ${s.name}${s.isHub?'<span class="hub-tag" style="margin-left:4px;">거점</span>':''}</div><div class="flow-sub">${s.type} · ${s.duration}</div></div></div>`).join('')}</div></div>`;
}

function showSD(){
  const s=cs;show();
  document.getElementById('dtitle').textContent='지점 정보';
  const kws=s.keywords||[];const hasCoord=s.lat&&s.lng;
  document.getElementById('dc').innerHTML=`
    ${s.isHub?`<div class="hub-box"><i class="ti ti-home"></i> 공통 거점지역 (구 우체국)</div>`:''}
    <div class="fg"><div class="fl">지점명</div>${em?`<input class="fi" id="e-sname" value="${esc(s.name)}">`:`<div class="fv" style="font-weight:600;">${s.name}</div>`}</div>
    <div class="fg"><div class="fl">유형</div>${em?`<input class="fi" id="e-stype" value="${esc(s.type)}">`:`<div class="fv">${s.type}</div>`}</div>
    <div class="fg"><div class="fl">위치 주소</div>
      ${em?`<div class="addr-row"><input class="fi" id="e-addr" value="${esc(s.addr||'')}" placeholder="주소 또는 장소명" onkeydown="if(event.key==='Enter')searchAddr()"><button class="addr-btn" onclick="searchAddr()"><i class="ti ti-search"></i></button></div><div class="addr-result ${hasCoord?'show ok':''}" id="addr-result">${hasCoord?`✓ ${s.addr} (${s.lat.toFixed(4)}, ${s.lng.toFixed(4)})`:'주소 입력 후 검색'}</div>`:`<div class="fv">${s.addr||'—'}</div>${hasCoord?`<div class="coord-note">📍 ${s.lat.toFixed(5)}, ${s.lng.toFixed(5)}</div>`:'<div class="coord-note warn">⚠ 좌표 미등록</div>'}`}
    </div>
    <div class="fg"><div class="fl">해설 내용</div>${em?`<textarea class="fta" id="e-sdesc" style="min-height:100px;">${esc(s.desc)}</textarea>`:`<div class="fv">${s.desc||'—'}</div>`}</div>
    <div class="fg"><div class="fl">미션</div>${em?`<textarea class="fta" id="e-smission" style="min-height:46px;" placeholder="미션 없으면 비워두세요">${esc(s.mission||'')}</textarea>`:`${s.mission?`<div class="mission-box"><i class="ti ti-flag"></i><span>${s.mission}</span></div>`:'<div class="fv" style="color:var(--text2);">없음</div>'}`}</div>
    <div class="fg"><div class="fl">체류 시간</div>${em?`<input class="fi" id="e-sdur" value="${esc(s.duration)}">`:`<div class="fv">${s.duration}</div>`}</div>
    <div class="fg"><div class="fl">키워드</div><div class="tag-row" id="kw-row">${kws.map((k,i)=>`<span class="tag">#${k}${em?`<button class="tag-del" onclick="delKw(${i})">×</button>`:''}</span>`).join('')}</div>${em?`<div class="tag-add-row"><input id="kw-inp" placeholder="키워드 추가" onkeydown="if(event.key==='Enter')addKw()"/><button onclick="addKw()">추가</button></div>`:''}</div>`;
}

function searchAddr(){
  if(!geocoder){alert('카카오맵 API 키를 먼저 적용해주세요.');return;}
  const inp=document.getElementById('e-addr');if(!inp)return;
  const addr=inp.value.trim();if(!addr){alert('주소를 입력해주세요.');return;}
  const r=document.getElementById('addr-result');
  if(r){r.className='addr-result show ing';r.textContent='검색 중...';}
  geocoder.addressSearch(addr,(res,status)=>{
    if(status===kakao.maps.services.Status.OK){applyCoord(parseFloat(res[0].y),parseFloat(res[0].x),res[0].address_name,r);}
    else{
      new kakao.maps.services.Places().keywordSearch(addr,(res2,status2)=>{
        if(status2===kakao.maps.services.Status.OK)applyCoord(parseFloat(res2[0].y),parseFloat(res2[0].x),res2[0].place_name,r);
        else if(r){r.className='addr-result show err';r.textContent='✗ 주소를 찾을 수 없습니다.';}
      });
    }
  });
}

function applyCoord(la,lo,name,r){
  cs.lat=la;cs.lng=lo;cs.addr=name;
  if(r){r.className='addr-result show ok';r.textContent=`✓ ${name} (${la.toFixed(4)}, ${lo.toFixed(4)})`;}
  if(kl&&km){km.setCenter(new kakao.maps.LatLng(la,lo));updateMap();}
}

function addKw(){if(!cs)return;const inp=document.getElementById('kw-inp');const v=inp.value.trim().replace(/^#/,'');if(!v)return;cs.keywords.push(v);inp.value='';rkr();}
function delKw(i){if(!cs)return;cs.keywords.splice(i,1);rkr();}
function rkr(){const row=document.getElementById('kw-row');if(!row)return;row.innerHTML=(cs.keywords||[]).map((k,i)=>`<span class="tag">#${k}${em?`<button class="tag-del" onclick="delKw(${i})">×</button>`:''}</span>`).join('');}
function pickColor(col){if(!cc)return;cc.color=col;cc.spots.forEach(s=>{if(!s.isHub)s.color=col;});showCD();}
function show(){document.getElementById('es').style.display='none';document.getElementById('dc').style.display='';document.getElementById('closeb').style.display='';}

function toggleEdit(){
  em=!em;
  document.getElementById('eb').style.display=em?'none':'';
  document.getElementById('sb2').style.display=em?'':'none';
  document.getElementById('db2').style.display=em?'none':'';
  if(cs)showSD();else showCD();
}

function saveEdit(){
  const gv=(id,fb)=>{const el=document.getElementById(id);return el?el.value:fb;};
  if(cs){
    cs.name=gv('e-sname',cs.name);cs.type=gv('e-stype',cs.type);
    cs.desc=gv('e-sdesc',cs.desc);cs.mission=gv('e-smission',cs.mission||'')||null;
    cs.duration=gv('e-sdur',cs.duration);
    const ae=document.getElementById('e-addr');if(ae&&ae.value)cs.addr=ae.value;
  }else if(cc){
    cc.name=gv('e-name',cc.name);cc.desc=gv('e-desc',cc.desc);
    cc.duration=gv('e-dur',cc.duration);cc.distance=gv('e-dist',cc.distance);cc.theme=gv('e-theme',cc.theme);
  }
  em=false;
  document.getElementById('eb').style.display='';document.getElementById('sb2').style.display='none';document.getElementById('db2').style.display='';
  document.getElementById('mt').textContent=cc.name;
  rl();rsl();if(cs)showSD();else showCD();updateMap();
  // 편집 저장 후 자동으로 클라우드에도 저장
  syncToCloud(true);
}

function closeDetail(){
  cs=null;em=false;
  document.getElementById('eb').style.display='none';document.getElementById('sb2').style.display='none';
  document.getElementById('es').style.display='';document.getElementById('dc').style.display='none';document.getElementById('closeb').style.display='none';
  document.getElementById('dtitle').textContent='상세 정보';rsl();
}

function moveSpot(id,dir){
  if(!cc)return;const i=cc.spots.findIndex(s=>s.id===id);const ni=i+dir;
  if(ni<0||ni>=cc.spots.length)return;
  [cc.spots[i],cc.spots[ni]]=[cc.spots[ni],cc.spots[i]];
  rsl();if(cs)showSD();else showCD();updateMap();
}

function showConfirm(title,msg,ok){
  const d=document.createElement('div');d.className='ov';
  d.innerHTML=`<div class="ob"><h4>${title}</h4><p>${msg}</p><div class="ob-btns"><button class="abtn" onclick="this.closest('.ov').remove()">취소</button><button class="abtn danger" id="co"><i class="ti ti-trash"></i> 삭제</button></div></div>`;
  document.body.appendChild(d);d.querySelector('#co').onclick=()=>{d.remove();ok();};
}
function confDelC2(){if(cc)confDelC(cc.id);}
function confDelC(id){
  const c=DATA.courses.find(x=>x.id===id);if(!c)return;
  showConfirm('코스 삭제',`"${c.name}" 코스를 삭제할까요?`,()=>{
    DATA.courses=DATA.courses.filter(x=>x.id!==id);
    if(cc&&cc.id===id){cc=null;cs=null;document.getElementById('mt').textContent='코스를 선택하세요';['eb','sb2','db2'].forEach(i=>document.getElementById(i).style.display='none');document.getElementById('es').style.display='';document.getElementById('dc').style.display='none';document.getElementById('closeb').style.display='none';}
    rl();rsl();updateMap();syncToCloud(true);
  });
}
function confDelS(id){
  const s=cc.spots.find(x=>x.id===id);if(!s)return;
  showConfirm('지점 삭제',`"${s.name}" 지점을 삭제할까요?`,()=>{
    cc.spots=cc.spots.filter(x=>x.id!==id);
    if(cs&&cs.id===id){cs=null;document.getElementById('es').style.display='';document.getElementById('dc').style.display='none';document.getElementById('closeb').style.display='none';}
    rsl();updateMap();syncToCloud(true);
  });
}

function handleAdd(){
  if(tab==='courses'){
    const name=prompt('새 코스 이름:');if(!name)return;
    DATA.courses.push({id:'c'+Date.now(),name,badge:'b-custom',badgeText:'신규',color:'#888780',isNew:true,desc:'',duration:'미정',distance:'미정',difficulty:'미정',theme:'',spots:[]});
    rl();syncToCloud(true);
  }else{
    if(!cc){alert('코스를 먼저 선택하세요');return;}
    const name=prompt('새 지점 이름:');if(!name)return;
    cc.spots.push({id:'sp'+Date.now(),name,type:'미분류',color:cc.color,lat:0,lng:0,addr:'',isHub:false,desc:'',duration:'미정',mission:null,keywords:[]});
    rsl();syncToCloud(true);
  }
}

function updateMap(){
  if(!kl||!km)return;
  mkrs.forEach(m=>m.setMap(null));mkrs=[];
  if(!cc||!cc.spots.length)return;
  cc.spots.filter(s=>s.lat&&s.lng).forEach((s)=>{
    const idx=cc.spots.indexOf(s);
    const pos=new kakao.maps.LatLng(s.lat,s.lng);
    const mk=new kakao.maps.Marker({position:pos,map:km});
    const iw=new kakao.maps.InfoWindow({content:`<div style="padding:6px 10px;font-size:12px;font-weight:600;">${idx+1}. ${s.name}</div>`});
    kakao.maps.event.addListener(mk,'click',()=>{iw.open(km,mk);selSpot(s.id);if(tab!=='spots')switchTab('spots');});
    mkrs.push(mk);
  });
  const valid=cc.spots.filter(s=>s.lat&&s.lng);
  if(valid.length>0)km.setCenter(new kakao.maps.LatLng(valid[0].lat,valid[0].lng));
}

function applyKey(){
  const key=document.getElementById('kk').value.trim();if(!key){alert('API 키를 입력해주세요');return;}
  if(kl){if(cc)updateMap();return;}
  const sc=document.createElement('script');
  sc.src=`//dapi.kakao.com/v2/maps/sdk.js?appkey=${key}&autoload=false&libraries=services`;
  sc.onload=()=>{kakao.maps.load(()=>{
    kl=true;geocoder=new kakao.maps.services.Geocoder();
    document.getElementById('map-ph').style.display='none';
    document.getElementById('api-ok').style.display='flex';
    km=new kakao.maps.Map(document.getElementById('map-container'),{center:new kakao.maps.LatLng(35.3057,128.5197),level:4});
    if(cc)updateMap();
  });};
  sc.onerror=()=>alert('API 키 오류입니다.');
  document.head.appendChild(sc);
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// 시작 시 클라우드에서 데이터 불러오기
loadFromCloud();
</script>
</body>
</html>
